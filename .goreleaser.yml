version: 2

builds:
  - main: .
    binary: dreamer
    ldflags:
      - -s -w
      - -X dreamer/cmd.version={{.Version}}
      - -X dreamer/cmd.commit={{.ShortCommit}}
      - -X dreamer/cmd.date={{.Date}}
    flags:
      - -trimpath
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format: binary
    name_template: "dreamer_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
