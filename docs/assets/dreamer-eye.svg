<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150">
  <defs>
    <filter id="g">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gw">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="150" rx="12" fill="#0f172a"/>

  <!-- Ambient glow around eye area -->
  <ellipse cx="300" cy="62" rx="95" ry="45" fill="none" stroke="#3cffd0" stroke-opacity="0.06" filter="url(#gw)">
    <animate attributeName="stroke-opacity" values="0.06;0.12;0.06" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ZZZ dream indicators -->
  <g opacity="0">
    <text font-family="monospace" font-size="14" fill="#3cffd0" x="345" y="48">z</text>
    <text font-family="monospace" font-size="11" fill="#3cffd0" x="360" y="38">z</text>
    <text font-family="monospace" font-size="8" fill="#3cffd0" x="372" y="30">z</text>
    <animate attributeName="opacity" values="0;0.45;0.45;0;0;0" keyTimes="0;0.08;0.28;0.375;0.376;1" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;8,-12;16,-24;24,-36" keyTimes="0;0.12;0.24;0.375" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Chat bubble 1 (upper-left) -->
  <g opacity="0">
    <rect x="88" y="30" width="50" height="26" rx="6" fill="none" stroke="#3cffd0" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="98" y1="39" x2="128" y2="39" stroke="#3cffd0" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="98" y1="46" x2="118" y2="46" stroke="#3cffd0" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M 96,56 L 91,63 L 102,56" fill="none" stroke="#3cffd0" stroke-width="1.2" stroke-opacity="0.5"/>
    <animate attributeName="opacity" values="0;0;0.8;0.8;0.8;0" keyTimes="0;0.05;0.25;0.625;0.875;1" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="-40,-10;-40,-10;0,0;0,0;0,0;-40,-10" keyTimes="0;0.05;0.25;0.625;0.875;1" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Chat bubble 2 (upper-right, larger) -->
  <g opacity="0">
    <rect x="455" y="22" width="58" height="30" rx="7" fill="none" stroke="#3cffd0" stroke-width="1.2" stroke-opacity="0.5"/>
    <line x1="467" y1="32" x2="501" y2="32" stroke="#3cffd0" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="467" y1="39" x2="493" y2="39" stroke="#3cffd0" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="467" y1="46" x2="499" y2="46" stroke="#3cffd0" stroke-width="1" stroke-opacity="0.3"/>
    <path d="M 503,52 L 509,59 L 515,52" fill="none" stroke="#3cffd0" stroke-width="1.2" stroke-opacity="0.5"/>
    <animate attributeName="opacity" values="0;0;0.8;0.8;0.8;0" keyTimes="0;0.1;0.3;0.625;0.875;1" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="40,-10;40,-10;0,0;0,0;0,0;40,-10" keyTimes="0;0.1;0.3;0.625;0.875;1" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Chat bubble 3 (lower-left, smaller) -->
  <g opacity="0">
    <rect x="120" y="78" width="42" height="22" rx="5" fill="none" stroke="#3cffd0" stroke-width="1.2" stroke-opacity="0.4"/>
    <line x1="129" y1="86" x2="153" y2="86" stroke="#3cffd0" stroke-width="1" stroke-opacity="0.25"/>
    <line x1="129" y1="92" x2="145" y2="92" stroke="#3cffd0" stroke-width="1" stroke-opacity="0.25"/>
    <animate attributeName="opacity" values="0;0;0.7;0.7;0.7;0" keyTimes="0;0.15;0.35;0.625;0.875;1" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="-30,15;-30,15;0,0;0,0;0,0;-30,15" keyTimes="0;0.15;0.35;0.625;0.875;1" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Upper eyelid -->
  <path fill="none" stroke="#3cffd0" stroke-width="2.5" stroke-linecap="round"
        d="M 220,62 C 260,62 340,62 380,62">
    <animate attributeName="d"
      values="M 220,62 C 260,62 340,62 380,62;
              M 220,62 C 260,62 340,62 380,62;
              M 220,62 C 260,25 340,25 380,62;
              M 220,62 C 260,25 340,25 380,62;
              M 220,62 C 260,25 340,25 380,62;
              M 220,62 C 260,62 340,62 380,62"
      keyTimes="0;0.375;0.5;0.625;0.875;1"
      dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Lower eyelid -->
  <path fill="none" stroke="#3cffd0" stroke-width="2.5" stroke-linecap="round"
        d="M 220,62 C 260,62 340,62 380,62">
    <animate attributeName="d"
      values="M 220,62 C 260,62 340,62 380,62;
              M 220,62 C 260,62 340,62 380,62;
              M 220,62 C 260,99 340,99 380,62;
              M 220,62 C 260,99 340,99 380,62;
              M 220,62 C 260,99 340,99 380,62;
              M 220,62 C 260,62 340,62 380,62"
      keyTimes="0;0.375;0.5;0.625;0.875;1"
      dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Iris (tracks left-to-right during scan) -->
  <circle cx="300" cy="62" r="16" fill="#3cffd0" opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0.9;0.9;0" keyTimes="0;0.375;0.5;0.625;0.875;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="300;300;293;307;300;300" keyTimes="0;0.42;0.48;0.56;0.625;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Pupil -->
  <circle cx="300" cy="62" r="7" fill="#0f172a" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;1;0" keyTimes="0;0.375;0.5;0.625;0.875;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="300;300;293;307;300;300" keyTimes="0;0.42;0.48;0.56;0.625;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Iris highlight -->
  <circle cx="305" cy="57" r="3" fill="#fff" opacity="0">
    <animate attributeName="opacity" values="0;0;0.3;0.3;0.3;0" keyTimes="0;0.375;0.5;0.625;0.875;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="305;305;298;312;305;305" keyTimes="0;0.42;0.48;0.56;0.625;1" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Scan line -->
  <line x1="200" y1="28" x2="200" y2="96" stroke="#3cffd0" stroke-width="1.5" stroke-opacity="0" filter="url(#g)">
    <animate attributeName="x1" values="200;200;410;410" keyTimes="0;0.375;0.625;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="200;200;410;410" keyTimes="0;0.375;0.625;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0;0;0.6;0.6;0;0" keyTimes="0;0.374;0.376;0.624;0.626;1" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Spark (above eye) -->
  <g transform="translate(300, 15)" opacity="0">
    <path d="M 0,-10 L 2,-3 L 10,0 L 2,3 L 0,10 L -2,3 L -10,0 L -2,-3 Z" fill="#3cffd0" filter="url(#g)"/>
    <animate attributeName="opacity" values="0;0;0;1;0.8;0;0" keyTimes="0;0.5;0.6;0.68;0.78;0.875;1" dur="4s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="scale" values="0.3;0.3;0.3;1.2;1;0.3;0.3" keyTimes="0;0.5;0.6;0.68;0.75;0.875;1" dur="4s" repeatCount="indefinite" additive="sum"/>
  </g>

  <!-- Shield + checkmark (below eye) -->
  <g transform="translate(300, 110)" opacity="0">
    <path d="M 0,-10 L 9,-5 L 9,3 Q 9,10 0,14 Q -9,10 -9,3 L -9,-5 Z" fill="none" stroke="#3cffd0" stroke-width="1.5"/>
    <polyline points="-4,1 -1,5 5,-2" fill="none" stroke="#3cffd0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <animate attributeName="opacity" values="0;0;0;0;1;0.8;0" keyTimes="0;0.65;0.7;0.72;0.78;0.875;1" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- Separator -->
  <line x1="250" y1="132" x2="350" y2="132" stroke="#3cffd0" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- DREAMER wordmark -->
  <text x="300" y="145" text-anchor="middle" font-family="monospace" font-size="10" fill="#3cffd0" opacity="0.35" letter-spacing="6" font-weight="bold">DREAMER</text>
</svg>
