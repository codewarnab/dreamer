# lefthook.yml — git hooks for dreamer.
# Install once:  make install-hooks   (runs `lefthook install`)
# Bypass once:   git commit --no-verify   (use sparingly — CI still enforces)
#
# Tiering philosophy (see doc/ / CLAUDE.md):
#   pre-commit  — instant, local hygiene; must stay < ~5s or people skip it.
#   commit-msg  — enforce HOW_TO_COMMIT.md conventions.
#   pre-push    — seconds; near-CI feedback on the diff before sharing.
#   CI          — authoritative: full lint, test -race, govulncheck.

pre-commit:
  parallel: true
  commands:
    # Format staged Go files: goimports first (import grouping), then the
    # stricter gofumpt. Chained sequentially in ONE command so the two
    # formatters never race on the same file's write. stage_fixed re-adds
    # whatever they rewrote so the commit includes the formatted version.
    format:
      glob: "*.go"
      run: goimports -w -local dreamer {staged_files} && gofumpt -w {staged_files}
      stage_fixed: true

    # go vet typechecks too, so this also rejects code that doesn't compile.
    vet:
      glob: "*.go"
      run: go vet ./...

    # Secret scan of the staged diff only — millisecond-fast, and the one
    # mistake a hook can't undo once pushed. Fails loud if gitleaks is absent
    # (install via `make tools`) — we never silently skip secret scanning.
    gitleaks:
      run: gitleaks protect --staged --redact --no-banner

    # go.mod / go.sum drift: `-diff` reports needed changes (exit!=0) WITHOUT
    # mutating the files. Catches the classic "tidy not run" CI breakage.
    gomod-tidy:
      glob: "{go.mod,go.sum}"
      run: go mod tidy -diff

    # Native git check: flags trailing whitespace AND leftover <<<<<<< merge
    # conflict markers in the staged diff. Zero extra tooling.
    whitespace-conflicts:
      run: git diff --cached --check

    # CLAUDE.md rule #10: don't ship plan/audit docs alongside implementation.
    # Fails when the staged diff mixes *.go with PLANS/**, findings.md, or
    # *-plan.md/*-audit.md (recurring scope-creep finding — PR #47, #57, #60).
    no-plan-docs:
      run: sh scripts/no-plan-docs.sh

commit-msg:
  commands:
    conventions:
      # {1} is the path to the commit-message file git passes to the hook.
      run: sh scripts/check-commit-msg.sh {1}

pre-push:
  parallel: true
  commands:
    # Validate the golangci-lint config schema itself. Catches invalid keys
    # that v2 silently ignores or rejects (PR #38 v1 keys, #60 v2 schema).
    golangci-config:
      run: golangci-lint config verify

    # Lint only what changed vs the diff base — 50-75% faster than a full run,
    # giving near-CI feedback before the diff leaves your machine. The base is
    # resolved by scripts/diff-base.sh so a fresh clone without origin/main
    # doesn't error (PR #57, #60). Full ./... lint stays in CI.
    golangci-changed:
      run: golangci-lint run --new-from-rev "$(sh scripts/diff-base.sh)" ./...
    quality-changed:
      run: go run ./tools/quality --diff-from "$(sh scripts/diff-base.sh)"

    # Fail on any changed .go file that isn't gofmt clean, scoped to the diff
    # base so pre-existing tree dirt doesn't block the push (PR #31, #57).
    gofmt-changed:
      run: sh scripts/gofmt-changed.sh
