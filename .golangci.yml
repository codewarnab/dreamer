version: "2"
linters:
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - funlen
    - gocritic
    - gocyclo
    - intrange
    - misspell
    - nakedret
    - nestif
    - revive
    - usetesting
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (net.Listener).Close
        - (net/http.ResponseWriter).Write
    funlen:
      lines: 80
    gocritic:
      disabled-checks:
        - ifElseChain
        - hugeParam
        - rangeValCopy
      enabled-tags:
        - diagnostic
        - style
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow
    misspell:
      locale: US
    nakedret:
      max-func-lines: 10
    nestif:
      min-complexity: 5
    revive:
      rules:
        - name: argument-limit
          arguments:
            - 6
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gocritic
        path: _test\.go
      - linters:
          - gocritic
        path: _test\.go
        text: dot-imports
      # Test files get more slack on complexity/length
      - linters:
          - funlen
          - nestif
          - gocyclo
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
      - provider-codebase
      - .claude
      - docs
      - PLANS
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
