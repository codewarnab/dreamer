run:
  timeout: 5m
  exclude-dirs:
    - provider-codebase
    - .claude
    - docs
    - PLANS

linters:
  enable:
    # Default on — catches real bugs
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - unused

    # Value-add
    - gocritic
    - misspell
    - gofmt

    # Complexity / structure (Phase 1 — code-quality-checker-plan)
    - gocyclo
    - funlen
    - nestif
    - nakedret
    - revive

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false
    exclude-functions:
      - (io.Closer).Close
      - (net.Listener).Close
      - (net/http.ResponseWriter).Write

  gocritic:
    enabled-tags:
      - diagnostic
      - style
    disabled-checks:
      - ifElseChain          # often less readable than switch
      - hugeParam            # false positives with structs
      - rangeValCopy         # noisy on small structs

  misspell:
    locale: US

  gocyclo:
    min-complexity: 15

  funlen:
    lines: 80

  nestif:
    min-complexity: 5

  nakedret:
    max-func-lines: 10

  revive:
    rules:
      - name: argument-limit
        arguments: [6]

  govet:
    enable:
      - shadow

issues:
  max-issues-per-linter: 50
  max-same-issues: 5

  exclude-rules:
    # Test files get more slack
    - path: _test\.go
      linters:
        - errcheck
        - gocritic

    # Allow dot imports in test files (testify, etc.)
    - path: _test\.go
      text: "dot-imports"
      linters:
        - gocritic
