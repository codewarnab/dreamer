category: config
enabled: true
threshold: 0.70
timeout_seconds: 40
mistake_prompt_template: |
  You are reading a chat transcript between a developer and an AI coding
  assistant working on the project at {{project_root}}.

  Toolchain in use:
  {{toolchain_summary}}

  Identify recurring mistakes the assistant made that a CONFIG file change
  (golangci.yml, eslint.config.js, ruff.toml, tsconfig.json, .editorconfig,
  pyproject.toml, etc.) would have prevented. Look for: assistant
  re-introducing patterns the config could ban, formatter drift, dependency
  pinning gaps, missing strictness flags.

  Return JSON of the shape:
  {"mistakes": [
    {"category": "config", "summary": "<one sentence>",
     "evidence_excerpt": "<short quote from the chat>", "confidence": 0.0-1.0}
  ]}

guardrail_prompt_template: |
  Propose the smallest CONFIG change that would have prevented the listed
  mistake on the project at {{project_root}}.

  Toolchain in use:
  {{toolchain_summary}}

  Relevant codebase context (file list):
  {{codebase_context}}

  Mistakes to address:
  {{mistakes}}

  Return JSON. `tool` is the config filename (must exist in the codebase
  context or be a well-known canonical filename). `config_snippet` is the
  exact lines to add or modify.

  {"findings": [
    {
      "mistake": "<repeat>",
      "guardrail": {
        "kind": "config",
        "tool": "<config filename>",
        "rule": "<setting name>",
        "config_snippet": "<yaml/json/toml snippet>",
        "apply": {
          "target_file": "<repo-relative path of the toolchain-detected config file>",
          "strategy": "replace-section",
          "anchor": "<existing section or key path to replace, or insertion point>",
          "snippet": "<exact config lines to insert or replace>"
        }
      },
      "codebase_evidence": [
        {"path": "<repo-relative path of the config file>",
         "lines": "<L1-L2>", "symbol": "<key path>"}
      ],
      "confidence": 0.0-1.0
    }
  ]}

response_schema:
  type: object
  required: [findings]
  properties:
    findings:
      type: array
      items:
        type: object
        required: [mistake, guardrail, confidence]
        properties:
          mistake: {type: string}
          guardrail:
            type: object
            required: [kind, tool, rule]
            properties:
              kind: {type: string, enum: [config]}
              tool: {type: string}
              rule: {type: string}
              config_snippet: {type: string}
              apply:
                type: object
                required: [target_file, strategy, snippet]
                properties:
                  target_file: {type: string}
                  strategy:
                    type: string
                    enum: [append-section, insert-after, replace-section, append-file, replace-file]
                  anchor: {type: string}
                  snippet: {type: string}
          codebase_evidence:
            type: array
            items:
              type: object
              properties:
                path: {type: string}
                lines: {type: string}
                symbol: {type: string}
          confidence: {type: number}
