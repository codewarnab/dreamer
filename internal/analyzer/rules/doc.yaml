category: doc
enabled: true
threshold: 0.60

phase1_category_description: "behavior the assistant misunderstood because the docs/comments were missing or wrong"

mistake_prompt_template: |
  Identify recurring mistakes the assistant made that a DOC update would
  have prevented. Look for: agent rediscovering contracts that should be
  documented, breaking implicit invariants nobody wrote down, asking
  questions the README/CLAUDE.md should have already answered, repeated
  surprise at sandbox/permission contract.

guardrail_prompt_template: |
  Propose the smallest DOC update (a new paragraph, callout, or section)
  that would have prevented the listed mistake. `path` MUST be a real
  doc-shaped file (README.md, CLAUDE.md, doc/*.md, ARCHITECTURE.md, ...)
  or an explicit new file under doc/.

  {"findings": [
    {
      "mistake": "<repeat>",
      "guardrail": {
        "kind": "doc",
        "tool": "<filename>",
        "rule": "<short heading or section name>",
        "config_snippet": "<the paragraph to add>",
        "apply": {
          "target_file": "<repo-relative path, e.g. CLAUDE.md>",
          "strategy": "append-section",
          "anchor": "<heading text>",
          "snippet": "<exact markdown to insert under that heading>"
        }
      },
      "codebase_evidence": [
        {"path": "<repo-relative doc path>",
         "lines": "<L1-L2 or NEW>", "symbol": "<heading>"}
      ],
      "confidence": 0.0-1.0
    }
  ]}

response_schema:
  type: object
  required: [findings]
  properties:
    findings:
      type: array
      items:
        type: object
        required: [mistake, guardrail, confidence]
        properties:
          mistake: {type: string}
          guardrail:
            type: object
            required: [kind, tool, rule]
            properties:
              kind: {type: string, enum: [doc]}
              tool: {type: string}
              rule: {type: string}
              config_snippet: {type: string}
              apply:
                type: object
                required: [target_file, strategy, snippet]
                properties:
                  target_file: {type: string}
                  strategy:
                    type: string
                    enum: [append-section, insert-after, replace-section, append-file, replace-file]
                  anchor: {type: string}
                  snippet: {type: string}
          codebase_evidence:
            type: array
            items:
              type: object
              properties:
                path: {type: string}
                lines: {type: string}
                symbol: {type: string}
          confidence: {type: number}
