category: doc
enabled: true
threshold: 0.60

phase1_preamble: |
  You are auditing chat transcripts of a developer working with an AI coding assistant.

phase1_category_description: "behavior the assistant misunderstood because the docs/comments were missing or wrong"

phase1_response_schema: |
  {"summary": "<= 2000 chars summarizing themes, in-progress threads, and the mistakes you flagged>",
   "mistakes": {"<category-id>": [{"category": "<id>", "summary": "<one sentence>",
    "evidence_excerpt": "<short quote>", "confidence": 0.0-1.0}]}}

phase2_preamble: |
  You are synthesizing guardrails from mistakes found across multiple transcript chunks.

phase2_response_schema: |
  {"findings": {"<category-id>": [{"category": "<id>", "mistake": "<one sentence>",
   "guardrail": {"kind": "<category>", "tool": "...", "rule": "...", "config_snippet": "...",
    "apply": {"target_file": "...", "strategy": "...", "anchor": "...", "snippet": "..."}},
   "codebase_evidence": [{"path": "...", "lines": "1-10", "symbol": "..."}],
   "confidence": 0.0-1.0}]}}

mistake_prompt_template: |
  Identify recurring mistakes the assistant made that a DOC update would
  have prevented. Look for: agent rediscovering contracts that should be
  documented, breaking implicit invariants nobody wrote down, asking
  questions the README/CLAUDE.md should have already answered, repeated
  surprise at sandbox/permission contract.

guardrail_prompt_template: |
  You have access to these tools to verify findings against the actual codebase:
  - Grep(pattern, path): search for patterns in files
  - Read(file_path, offset, limit): read specific file contents
  - Glob(pattern): find files by pattern

  For each mistake:
  1. Use Grep to find the relevant code patterns in the codebase
  2. Read the specific files to understand the actual implementation
  3. Only propose a guardrail if you can cite real code evidence (path, lines, symbol)
  4. If the mistake doesn't match the actual code, skip it

  Propose the smallest DOC update (a new paragraph, callout, or section)
  that would have prevented the listed mistake. `path` MUST be a real
  doc-shaped file (README.md, CLAUDE.md, doc/*.md, ARCHITECTURE.md, ...)
  or an explicit new file under doc/.

  {"findings": [
    {
      "mistake": "<repeat>",
      "guardrail": {
        "kind": "doc",
        "tool": "<filename>",
        "rule": "<short heading or section name>",
        "config_snippet": "<the paragraph to add>",
        "apply": {
          "target_file": "<repo-relative path, e.g. CLAUDE.md>",
          "strategy": "append-section",
          "anchor": "<heading text>",
          "snippet": "<exact markdown to insert under that heading>"
        }
      },
      "codebase_evidence": [
        {"path": "<repo-relative doc path>",
         "lines": "<L1-L2 or NEW>", "symbol": "<heading>"}
      ],
      "confidence": 0.0-1.0
    }
  ]}

response_schema:
  type: object
  required: [findings]
  properties:
    findings:
      type: array
      items:
        type: object
        required: [mistake, guardrail, confidence]
        properties:
          mistake: {type: string}
          guardrail:
            type: object
            required: [kind, tool, rule]
            properties:
              kind: {type: string, enum: [doc]}
              tool: {type: string}
              rule: {type: string}
              config_snippet: {type: string}
              apply:
                type: object
                required: [target_file, strategy, snippet]
                properties:
                  target_file: {type: string}
                  strategy:
                    type: string
                    enum: [append-section, insert-after, replace-section, append-file, replace-file]
                  anchor: {type: string}
                  snippet: {type: string}
          codebase_evidence:
            type: array
            items:
              type: object
              properties:
                path: {type: string}
                lines: {type: string}
                symbol: {type: string}
          confidence: {type: number}
