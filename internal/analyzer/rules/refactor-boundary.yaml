category: refactor-boundary
enabled: true
threshold: 0.70

phase1_preamble: |
  You are auditing chat transcripts of a developer working with an AI coding assistant.

phase1_category_description: "abstraction or module-boundary violations a structural rule would have flagged"

phase1_response_schema: |
  {"summary": "<= 2000 chars summarizing themes, in-progress threads, and the mistakes you flagged>",
   "mistakes": {"<category-id>": [{"category": "<id>", "summary": "<one sentence>",
    "evidence_excerpt": "<short quote>", "confidence": 0.0-1.0}]}}

phase2_preamble: |
  You are synthesizing guardrails from mistakes found across multiple transcript chunks.

phase2_response_schema: |
  {"findings": {"<category-id>": [{"category": "<id>", "mistake": "<one sentence>",
   "guardrail": {"kind": "<category>", "tool": "...", "rule": "...", "config_snippet": "...",
    "apply": {"target_file": "...", "strategy": "...", "anchor": "...", "snippet": "..."}},
   "codebase_evidence": [{"path": "...", "lines": "1-10", "symbol": "..."}],
   "confidence": 0.0-1.0}]}}

mistake_prompt_template: |
  Identify recurring mistakes the assistant made that a REFACTOR BOUNDARY
  (a named abstraction, interface, or module split) would have prevented.
  Look for: agent repeatedly leaking knowledge across layers, re-deriving
  the same helper inline, breaking a hidden invariant because the boundary
  was implicit, fighting with global state that should be a typed
  parameter.

guardrail_prompt_template: |
  You have access to these tools to verify findings against the actual codebase:
  - Grep(pattern, path): search for patterns in files
  - Read(file_path, offset, limit): read specific file contents
  - Glob(pattern): find files by pattern

  For each mistake:
  1. Use Grep to find the relevant code patterns in the codebase
  2. Read the specific files to understand the actual implementation
  3. Only propose a guardrail if you can cite real code evidence (path, lines, symbol)
  4. If the mistake doesn't match the actual code, skip it

  Propose the smallest REFACTOR BOUNDARY (extracted function, new
  interface, package split, struct field, etc.) that would have prevented
  the listed mistake. `tool` is the package or directory the new boundary
  lives in. `rule` names the new abstraction. `config_snippet` is the Go
  (or language-appropriate) interface/signature stub. Cite at least one
  real file in `codebase_evidence`.

  {"findings": [
    {
      "mistake": "<repeat>",
      "guardrail": {
        "kind": "refactor-boundary",
        "tool": "<package or directory>",
        "rule": "<name of new abstraction>",
        "config_snippet": "<signature stub>",
        "apply": {
          "target_file": "<repo-relative path of the file the boundary lives in>",
          "strategy": "insert-after",
          "anchor": "<existing symbol or section to insert after>",
          "snippet": "<exact signature/stub source to insert>"
        }
      },
      "codebase_evidence": [
        {"path": "<repo-relative path of an existing symbol that motivates it>",
         "lines": "<L1-L2>", "symbol": "<func or type>"}
      ],
      "confidence": 0.0-1.0
    }
  ]}

response_schema:
  type: object
  required: [findings]
  properties:
    findings:
      type: array
      items:
        type: object
        required: [mistake, guardrail, confidence]
        properties:
          mistake: {type: string}
          guardrail:
            type: object
            required: [kind, tool, rule]
            properties:
              kind: {type: string, enum: [refactor-boundary]}
              tool: {type: string}
              rule: {type: string}
              config_snippet: {type: string}
              apply:
                type: object
                required: [target_file, strategy, snippet]
                properties:
                  target_file: {type: string}
                  strategy:
                    type: string
                    enum: [append-section, insert-after, replace-section, append-file, replace-file]
                  anchor: {type: string}
                  snippet: {type: string}
          codebase_evidence:
            type: array
            items:
              type: object
              properties:
                path: {type: string}
                lines: {type: string}
                symbol: {type: string}
          confidence: {type: number}
