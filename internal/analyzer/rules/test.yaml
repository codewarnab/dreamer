category: test
enabled: true
threshold: 0.65
timeout_seconds: 45
mistake_prompt_template: |
  You are reading a chat transcript between a developer and an AI coding
  assistant working on the project at {{project_root}}.

  Toolchain in use:
  {{toolchain_summary}}

  Identify recurring mistakes the assistant made that a NEW TEST (unit,
  integration, regression, fuzz) would have prevented. Look for: missing
  edge-case coverage, regressions reintroduced because no test guards them,
  silent failure modes never asserted, behaviour drift between agent attempts.

  Return JSON of the shape:
  {"mistakes": [
    {"category": "test", "summary": "<one sentence>",
     "evidence_excerpt": "<short quote from the chat>", "confidence": 0.0-1.0}
  ]}

  Only emit mistakes you can quote evidence for.

guardrail_prompt_template: |
  Propose the smallest TEST that would have caught the listed mistake on
  the project at {{project_root}}.

  Toolchain in use:
  {{toolchain_summary}}

  Relevant codebase context:
  {{codebase_context}}

  Mistakes to address:
  {{mistakes}}

  Return JSON of this shape. The `path` MUST exist in the codebase context.
  Prefer the project's existing test framework ({{test_framework}}).

  {"findings": [
    {
      "mistake": "<repeat>",
      "guardrail": {
        "kind": "test",
        "tool": "<test framework>",
        "rule": "<one-line description of the test case>",
        "config_snippet": "<test stub or assertion snippet>"
      },
      "codebase_evidence": [
        {"path": "<repo-relative path of the code under test>",
         "lines": "<L1-L2>", "symbol": "<func or type>"}
      ],
      "confidence": 0.0-1.0
    }
  ]}

response_schema:
  type: object
  required: [findings]
  properties:
    findings:
      type: array
      items:
        type: object
        required: [mistake, guardrail, confidence]
        properties:
          mistake: {type: string}
          guardrail:
            type: object
            required: [kind, tool, rule]
            properties:
              kind: {type: string, enum: [test]}
              tool: {type: string}
              rule: {type: string}
              config_snippet: {type: string}
          codebase_evidence:
            type: array
            items:
              type: object
              properties:
                path: {type: string}
                lines: {type: string}
                symbol: {type: string}
          confidence: {type: number}
