category: lint-rule
enabled: true
threshold: 0.70

phase1_category_description: "static-analysis miss the assistant kept making (would a lint rule have caught it?)"

mistake_prompt_template: |
  Identify recurring mistakes the assistant made that a LINT RULE would
  have prevented. Look for: nil dereference patterns, missing error
  checks, shadowed variables, unsafe type assertions, banned API usage,
  formatting drift, dead code, exhaustiveness gaps.

guardrail_prompt_template: |
  Propose the smallest LINT RULE that would have prevented the listed
  mistake. Pick a lint rule that actually exists in the toolchain's
  linter ({{primary_linter}}). Cite at least one real path/symbol from
  the codebase as `codebase_evidence`.

  Schema:
  {"findings": [
    {
      "mistake": "<repeat of mistake summary>",
      "guardrail": {
        "kind": "lint-rule",
        "tool": "<linter name>",
        "rule": "<rule id>",
        "config_snippet": "<yaml or json snippet to enable the rule>",
        "apply": {
          "target_file": "<repo-relative path, e.g. .golangci.yml / .eslintrc.* / pyproject.toml>",
          "strategy": "insert-after",
          "anchor": "<heading or key path to insert after, or section name to replace>",
          "snippet": "<exact config lines to insert or replace>"
        }
      },
      "codebase_evidence": [
        {"path": "<repo-relative path>", "lines": "<L1-L2>", "symbol": "<func or type>"}
      ],
      "confidence": 0.0-1.0
    }
  ]}

response_schema:
  type: object
  required: [findings]
  properties:
    findings:
      type: array
      items:
        type: object
        required: [mistake, guardrail, confidence]
        properties:
          mistake: {type: string}
          guardrail:
            type: object
            required: [kind, tool, rule]
            properties:
              kind: {type: string, enum: [lint-rule]}
              tool: {type: string}
              rule: {type: string}
              config_snippet: {type: string}
              apply:
                type: object
                required: [target_file, strategy, snippet]
                properties:
                  target_file: {type: string}
                  strategy:
                    type: string
                    enum: [append-section, insert-after, replace-section, append-file, replace-file]
                  anchor: {type: string}
                  snippet: {type: string}
          codebase_evidence:
            type: array
            items:
              type: object
              properties:
                path: {type: string}
                lines: {type: string}
                symbol: {type: string}
          confidence: {type: number}
