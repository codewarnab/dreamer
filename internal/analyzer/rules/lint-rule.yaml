category: lint-rule
enabled: true
threshold: 0.70
timeout_seconds: 45
mistake_prompt_template: |
  You are reading a chat transcript between a developer and an AI coding assistant
  working on the project at {{project_root}}.

  Toolchain in use:
  {{toolchain_summary}}

  Identify recurring mistakes the assistant made in this chat that a LINT RULE
  would have prevented. Examples: nil dereference patterns the linter could
  catch, missing error checks, shadowed variables, unsafe type assertions,
  banned API usage, formatting drift, dead code, exhaustiveness gaps.

  Return JSON of the shape:
  {"mistakes": [
    {"category": "lint-rule", "summary": "<one sentence>",
     "evidence_excerpt": "<short quote from the chat>", "confidence": 0.0-1.0}
  ]}

  Be strict. Only emit mistakes that you can quote evidence for. If no mistakes
  qualify, return {"mistakes": []}.

guardrail_prompt_template: |
  You are proposing the smallest preventative LINT RULE that would have
  stopped the assistant making the listed mistake on the project at
  {{project_root}}.

  Toolchain in use:
  {{toolchain_summary}}

  Relevant codebase context (file list capped):
  {{codebase_context}}

  Mistakes to address:
  {{mistakes}}

  Return JSON conforming to this schema. Cite at least one real path/symbol
  from the codebase context as `codebase_evidence`. Pick a lint rule that
  actually exists in the toolchain's linter ({{primary_linter}}).

  Schema:
  {"findings": [
    {
      "mistake": "<repeat of mistake summary>",
      "guardrail": {
        "kind": "lint-rule",
        "tool": "<linter name>",
        "rule": "<rule id>",
        "config_snippet": "<yaml or json snippet to enable the rule>",
        "apply": {
          "target_file": "<repo-relative path, e.g. .golangci.yml / .eslintrc.* / pyproject.toml>",
          "strategy": "insert-after",
          "anchor": "<heading or key path to insert after, or section name to replace>",
          "snippet": "<exact config lines to insert or replace>"
        }
      },
      "codebase_evidence": [
        {"path": "<repo-relative path>", "lines": "<L1-L2>", "symbol": "<func or type>"}
      ],
      "confidence": 0.0-1.0
    }
  ]}

response_schema:
  type: object
  required: [findings]
  properties:
    findings:
      type: array
      items:
        type: object
        required: [mistake, guardrail, confidence]
        properties:
          mistake: {type: string}
          guardrail:
            type: object
            required: [kind, tool, rule]
            properties:
              kind: {type: string, enum: [lint-rule]}
              tool: {type: string}
              rule: {type: string}
              config_snippet: {type: string}
              apply:
                type: object
                required: [target_file, strategy, snippet]
                properties:
                  target_file: {type: string}
                  strategy:
                    type: string
                    enum: [append-section, insert-after, replace-section, append-file, replace-file]
                  anchor: {type: string}
                  snippet: {type: string}
          codebase_evidence:
            type: array
            items:
              type: object
              properties:
                path: {type: string}
                lines: {type: string}
                symbol: {type: string}
          confidence: {type: number}
