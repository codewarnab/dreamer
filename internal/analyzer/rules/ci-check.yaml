category: ci-check
enabled: true
threshold: 0.70

phase1_preamble: |
  You are auditing chat transcripts of a developer working with an AI coding assistant.

phase1_category_description: "process gaps a CI/pre-commit check would have caught before merge"

phase1_response_schema: |
  {"summary": "<= 2000 chars summarizing themes, in-progress threads, and the mistakes you flagged>",
   "mistakes": {"<category-id>": [{"category": "<id>", "summary": "<one sentence>",
    "evidence_excerpt": "<short quote>", "confidence": 0.0-1.0}]}}

phase2_preamble: |
  You are synthesizing guardrails from mistakes found across multiple transcript chunks.

phase2_response_schema: |
  {"findings": {"<category-id>": [{"category": "<id>", "mistake": "<one sentence>",
   "guardrail": {"kind": "<category>", "tool": "...", "rule": "...", "config_snippet": "...",
    "apply": {"target_file": "...", "strategy": "...", "anchor": "...", "snippet": "..."}},
   "codebase_evidence": [{"path": "...", "lines": "1-10", "symbol": "..."}],
   "confidence": 0.0-1.0}]}}

mistake_prompt_template: |
  Identify recurring mistakes the assistant made that a NEW CI CHECK would
  have caught before merge. Look for: missed lint runs, missing type check
  gate, format drift not caught in CI, missing security scan, missing
  build/compile gate, missing integration smoke, missing migration dry-run.

guardrail_prompt_template: |
  You have access to these tools to verify findings against the actual codebase:
  - Grep(pattern, path): search for patterns in files
  - Read(file_path, offset, limit): read specific file contents
  - Glob(pattern): find files by pattern

  For each mistake:
  1. Use Grep to find the relevant code patterns in the codebase
  2. Read the specific files to understand the actual implementation
  3. Only propose a guardrail if you can cite real code evidence (path, lines, symbol)
  4. If the mistake doesn't match the actual code, skip it

  Propose the smallest CI CHECK (job, step, or gate) that would have
  prevented the listed mistake. `config_snippet` must be valid for
  whatever CI system the project uses (GitHub Actions / GitLab CI /
  Buildkite / etc.).

  {"findings": [
    {
      "mistake": "<repeat>",
      "guardrail": {
        "kind": "ci-check",
        "tool": "<github-actions | gitlab-ci | buildkite | other>",
        "rule": "<step name>",
        "config_snippet": "<yaml or shell snippet>",
        "apply": {
          "target_file": "<repo-relative path, e.g. .github/workflows/ci.yml or .gitlab-ci.yml>",
          "strategy": "insert-after",
          "anchor": "<existing step or job name to insert after>",
          "snippet": "<exact yaml step(s) to insert>"
        }
      },
      "codebase_evidence": [
        {"path": "<repo-relative path of the existing CI config or code area>",
         "lines": "<L1-L2>", "symbol": "<job/step name or func>"}
      ],
      "confidence": 0.0-1.0
    }
  ]}

response_schema:
  type: object
  required: [findings]
  properties:
    findings:
      type: array
      items:
        type: object
        required: [mistake, guardrail, confidence]
        properties:
          mistake: {type: string}
          guardrail:
            type: object
            required: [kind, tool, rule]
            properties:
              kind: {type: string, enum: [ci-check]}
              tool: {type: string}
              rule: {type: string}
              config_snippet: {type: string}
              apply:
                type: object
                required: [target_file, strategy, snippet]
                properties:
                  target_file: {type: string}
                  strategy:
                    type: string
                    enum: [append-section, insert-after, replace-section, append-file, replace-file]
                  anchor: {type: string}
                  snippet: {type: string}
          codebase_evidence:
            type: array
            items:
              type: object
              properties:
                path: {type: string}
                lines: {type: string}
                symbol: {type: string}
          confidence: {type: number}
