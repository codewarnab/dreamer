category: ci-check
enabled: true
threshold: 0.70
timeout_seconds: 45
mistake_prompt_template: |
  You are reading a chat transcript between a developer and an AI coding
  assistant working on the project at {{project_root}}.

  Toolchain in use:
  {{toolchain_summary}}

  Identify recurring mistakes the assistant made that a NEW CI CHECK would
  have caught before merge. Look for: missed lint runs, missing type check
  gate, format drift not caught in CI, missing security scan, missing
  build/compile gate, missing integration smoke, missing migration dry-run.

  Return JSON of the shape:
  {"mistakes": [
    {"category": "ci-check", "summary": "<one sentence>",
     "evidence_excerpt": "<short quote from the chat>", "confidence": 0.0-1.0}
  ]}

guardrail_prompt_template: |
  Propose the smallest CI CHECK (job, step, or gate) that would have
  prevented the listed mistake on the project at {{project_root}}.

  Toolchain in use:
  {{toolchain_summary}}

  Relevant codebase context:
  {{codebase_context}}

  Mistakes to address:
  {{mistakes}}

  Return JSON. `config_snippet` must be valid for whatever CI system the
  project uses (GitHub Actions / GitLab CI / Buildkite / etc.).

  {"findings": [
    {
      "mistake": "<repeat>",
      "guardrail": {
        "kind": "ci-check",
        "tool": "<github-actions | gitlab-ci | buildkite | other>",
        "rule": "<step name>",
        "config_snippet": "<yaml or shell snippet>",
        "apply": {
          "target_file": "<repo-relative path, e.g. .github/workflows/ci.yml or .gitlab-ci.yml>",
          "strategy": "insert-after",
          "anchor": "<existing step or job name to insert after>",
          "snippet": "<exact yaml step(s) to insert>"
        }
      },
      "codebase_evidence": [
        {"path": "<repo-relative path of the existing CI config or code area>",
         "lines": "<L1-L2>", "symbol": "<job/step name or func>"}
      ],
      "confidence": 0.0-1.0
    }
  ]}

response_schema:
  type: object
  required: [findings]
  properties:
    findings:
      type: array
      items:
        type: object
        required: [mistake, guardrail, confidence]
        properties:
          mistake: {type: string}
          guardrail:
            type: object
            required: [kind, tool, rule]
            properties:
              kind: {type: string, enum: [ci-check]}
              tool: {type: string}
              rule: {type: string}
              config_snippet: {type: string}
              apply:
                type: object
                required: [target_file, strategy, snippet]
                properties:
                  target_file: {type: string}
                  strategy:
                    type: string
                    enum: [append-section, insert-after, replace-section, append-file, replace-file]
                  anchor: {type: string}
                  snippet: {type: string}
          codebase_evidence:
            type: array
            items:
              type: object
              properties:
                path: {type: string}
                lines: {type: string}
                symbol: {type: string}
          confidence: {type: number}
