{{define "content"}}
<section x-data="providersPage()" x-init="load()">
  <header style="margin-bottom: var(--space-5);">
    <span class="kicker">system</span>
    <h1 class="headline-lg">providers</h1>
  </header>

  <div class="card">
    <table class="table">
      <thead><tr><th>id</th><th>model</th><th>status</th><th>last used</th><th>tokens</th></tr></thead>
      <tbody>
        <template x-for="p in providers" :key="p.id">
          <tr>
            <td x-text="p.id"></td>
            <td x-text="p.model"></td>
            <td>
              <span class="pill" :class="p.healthy ? 'pill--healthy' : 'pill--warn'" x-text="p.healthy ? 'healthy' : 'down'"></span>
            </td>
            <td x-text="p.last_used ? new Date(p.last_used).toLocaleString() : '—'"></td>
            <td x-text="p.tokens_used ?? '—'"></td>
          </tr>
        </template>
      </tbody>
    </table>
    <div x-show="providers.length === 0" style="color: var(--text-secondary);">no providers configured.</div>
  </div>
</section>

<script>
window.providersPage = function () {
  return {
    providers: [],
    load: async function () {
      const r = await fetch("/api/providers");
      if (!r.ok) return;
      const data = await r.json();
      this.providers = data.providers || data || [];
    },
  };
};
</script>
{{end}}
