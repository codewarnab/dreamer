{{define "jobs_run_history"}}
<div class="card">
  <div class="kicker">run history</div>
  <table class="table" style="margin-top: var(--space-3);">
    <thead>
      <tr>
        <th>run id</th>
        <th>status</th>
        <th>scheduled for</th>
        <th>duration</th>
        <th>summary</th>
      </tr>
    </thead>
    <tbody>
      <template x-for="run in runs" :key="run.id">
        <tbody>
          <tr @click="toggleActivity(run.id)" style="cursor: pointer;">
            <td x-text="run.id.substring(0, 8)" style="font-family: var(--font-mono);"></td>
            <td>
              <span class="pill" :class="runStatusPill(run).class" x-text="runStatusPill(run).label"></span>
            </td>
            <td x-text="new Date(run.scheduled_for).toLocaleString()"></td>
            <td x-text="formatDuration(run.duration_millis)"></td>
            <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
              <span x-text="run.output_summary || run.error || run.skipped_reason || '—'"></span>
              <span x-show="run.activity_summary" style="margin-left: var(--space-2); font-size: var(--text-xs); color: var(--text-secondary);"
                x-text="run.activity_summary ? run.activity_summary.processes + 'p, ' + run.activity_summary.connections + 'c' : ''"></span>
            </td>
          </tr>
          <tr x-show="expandedRun === run.id && activityData" x-cloak>
            <td colspan="5" style="padding: 0;">
              <div style="padding: var(--space-3); background: var(--surface-1);">
                <div x-show="activityLoading" style="color: var(--text-secondary);">Loading activity...</div>
                <div x-show="!activityLoading && activityData">
                  <!-- Process events -->
                  <div x-show="activityData?.events?.some(e => e.type === 'process_start')">
                    <div class="kicker" style="margin-bottom: var(--space-2);">processes</div>
                    <table class="table" style="font-size: var(--text-sm);">
                      <thead><tr><th>time</th><th>process</th><th>PID</th><th>detail</th></tr></thead>
                      <tbody>
                        <template x-for="evt in activityData.events.filter(e => e.type === 'process_start')" :key="evt.ts + evt.pid">
                          <tr :style="evt.detail === 'SHELL_INTERPRETER' ? 'color: var(--color-error)' : ''">
                            <td x-text="new Date(evt.ts).toLocaleTimeString()"></td>
                            <td x-text="evt.exe || 'unknown'"></td>
                            <td x-text="evt.pid"></td>
                            <td x-text="evt.detail || '—'"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                  <!-- Network events -->
                  <div x-show="activityData?.events?.some(e => e.type === 'connection')" style="margin-top: var(--space-3);">
                    <div class="kicker" style="margin-bottom: var(--space-2);">network connections</div>
                    <table class="table" style="font-size: var(--text-sm);">
                      <thead><tr><th>process</th><th>remote</th><th>host</th><th>state</th></tr></thead>
                      <tbody>
                        <template x-for="evt in activityData.events.filter(e => e.type === 'connection')" :key="evt.ts + evt.remote">
                          <tr>
                            <td x-text="evt.exe || 'pid:' + evt.pid"></td>
                            <td x-text="evt.remote || '—'"></td>
                            <td x-text="evt.host || '—'"></td>
                            <td x-text="evt.state || '—'"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                  <div x-show="!activityData?.events?.length" style="color: var(--text-secondary);">No activity recorded for this run.</div>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </template>
    </tbody>
  </table>
  <div x-show="runs.length === 0" style="color: var(--text-secondary); padding: var(--space-4) 0;">No runs yet.</div>
</div>
{{end}}
