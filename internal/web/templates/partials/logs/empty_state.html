{{define "logs_empty_state"}}
<!-- Empty State for Empty Log Files or Missing Matches -->
<div x-show="raw.trim() && filteredLines().length === 0" style="padding: var(--space-7) var(--space-5); text-align: center; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-2);">
  <h4 style="margin: 0; font-family: var(--font-body); font-weight: 600; font-size: 16px; color: var(--text-muted);">No matching log entries</h4>
  <p style="color: var(--text-secondary); font-size: 13px; line-height: 1.4; margin: 0;">
    We couldn't find any log lines matching severity level <code style="color: var(--focus-cyan);" x-text="level"></code>
    <span x-show="searchQuery.trim()"> or search query "<span style="color: var(--color-warn);" x-text="searchQuery"></span>"</span>.
  </p>
</div>
{{end}}
