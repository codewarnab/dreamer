{{define "shared_topbar"}}
<header class="topbar">
  <div style="display: flex; align-items: center; gap: var(--space-3);">
    <span class="pill" :class="status === 'running' ? 'pill--healthy' : 'pill--warn'" x-text="status">running</span>
    <span class="pill" :class="$store.sse.connected ? 'pill--healthy' : 'pill--warn'" x-text="$store.sse.connected ? 'sse: ok' : 'sse: reconnecting'">sse: connecting</span>
  </div>
  <div style="display: flex; align-items: center; gap: var(--space-3);">
    <button class="btn btn--ghost" @click="$store.theme.toggle()"
            :title="$store.theme.current === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
            style="font-size: 16px; padding: var(--space-1) var(--space-2); line-height: 1;">
      <span x-text="$store.theme.current === 'dark' ? '☾' : '☀'"></span>
    </button>
    <button class="btn btn--run" @click="runNow()" :disabled="busy" x-text="busy ? 'queuing...' : 'run now'">run now</button>
    <span x-show="msg" x-text="msg" style="font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary);"></span>
  </div>
</header>
{{end}}
